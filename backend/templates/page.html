<!doctype html><html><head><meta charset="utf-8"><title>{{ page_name }} | ColdChain AI</title><style>body{margin:0;background:#07131f;color:#dbe9f5;font:15px system-ui}.wrap{max-width:1050px;margin:auto;padding:32px}.card{background:#0d2133;border:1px solid #183a51;border-radius:12px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:25px;font-weight:750;margin:8px 0}.muted{color:#8aa5bb;font-size:12px}.good{color:#62e6c3}a{color:#55dfff}button{background:#55dfff;border:0;border-radius:6px;padding:10px;margin:8px 8px 8px 0}input{padding:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}</style></head><body><main class="wrap"><a href="/">← Overview</a><h1>{{ page_name }}</h1><p class="good">● DEMONSTRATION / SIMULATION MODE</p><div class="card" id="controls"></div><section class="grid" id="cards"></section><div class="card"><h2 id="heading">Loading operational data…</h2><p id="summary" class="muted"></p></div></main><script>const page='{{ page_name }}'.toLowerCase(),cards=document.getElementById('cards'),summary=document.getElementById('summary');fetch('/api/pipeline/').then(r=>r.json()).then(x=>{if(!x.success)throw Error(x.error);let d=x.data,r=d.risk,a=d.recommended_solution;heading.textContent='Sensor '+d.sensor+' · '+r.risk_level+' future risk';summary.textContent=r.risk_reason;cards.innerHTML=[['Current temperature',d.reading.temperature.toFixed(2)+' °C','Observed sensor value'],['Future risk',r.risk_level+' · '+r.risk_score.toFixed(2),'MAD-TCN forecast assessment'],['Cooling action',Math.round(a.cooling_intensity*100)+'%','NSGA-II selected intensity'],['Estimated energy',a.estimated_energy_kwh.toFixed(3)+' kWh','Estimated / simulated'],['Compressor duty',Math.round(a.compressor_duty_cycle*100)+'%','Recommended operating duty'],['Forecast breach',r.predicted_breach_time?'Step '+r.predicted_breach_time:'None predicted','15-step outlook']].map(c=>'<div class="card"><div class="muted">'+c[0]+'</div><div class="metric">'+c[1]+'</div><div class="muted">'+c[2]+'</div></div>').join('')}).catch(()=>{heading.textContent='Unable to load pipeline data';summary.innerHTML='<button onclick="location.reload()">Retry</button>'});if(page==='upload'){controls.innerHTML='<h2>Upload sensor CSV</h2><p class=muted>Required: timestamp, sensor_id, temperature. Model retraining is separate.</p><input id=file type=file accept=.csv><button id=go>Validate and Persist</button><p id=result class=muted></p>';go.onclick=()=>{let f=new FormData();f.append('file',file.files[0]);fetch('/api/upload/',{method:'POST',body:f}).then(x=>x.json()).then(x=>result.textContent=x.success?'Persisted '+x.rows_persisted+' valid row(s).':'Upload failed: '+x.errors.join(', '))}}if(page==='reports'){controls.innerHTML='<h2>Current reports</h2><p class=muted>Includes forecast, future risk, estimated energy, model metrics and limitations.</p><button id=go>Generate report</button><p id=result></p>';go.onclick=()=>fetch('/api/reports/generate/',{method:'POST'}).then(x=>x.json()).then(x=>result.innerHTML=x.files.map(f=>'<a href=/reports/'+f+'>Download '+f+'</a>').join(' · '))}</script></body></html>
